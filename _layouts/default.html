<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>

    <meta name="google-site-verification" content="rfKGqAPy-_SeHW9SGSdoaXTnB9s5RIr5cTl9giPzU44" />
    <title>{{ site.title | default: site.github.repository_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3N9NTVV4T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Q3N9NTVV4T');
    </script>

  <body>
    <div class="wrapper">
      <aside class="sidebar">
        <div class="sidebar__inner">
          <div class="sidebar__identity">
            <img class="sidebar__photo" src="files/hemphill_headshot.png"
              alt="Headshot of Libby — a woman with short gray hair, smiling, and wearing a black sweater" />
            <h1 class="sidebar__name"><a href="/">{{ site.title | default: site.github.repository_name }}</a></h1>
            <p class="sidebar__title">PhD &middot; Associate Professor</p>
          </div>
          <nav class="sidebar__nav">
            <a href="https://www.si.umich.edu/people/libby-hemphill" rel="noopener">UMSI</a>

            <a href="http://github.com/casmlab" rel="noopener">Lab GitHub</a>
            <a href="http://github.com/libbyh" rel="noopener">Personal GitHub</a>
            <a href="https://orcid.org/0000-0002-3793-7281" rel="noopener">ORCID</a>
          </nav>
        </div>
      </aside>
      <main class="content">
        {{ content }}
      </main>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
